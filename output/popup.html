<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🐡 Stand Up Or You'll Turn Into A Blob Fish - Stand Tracker</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"><style>:root{--sit:#4f8ef7;--stand:#38d9a9;--walk:#a78bfa;--offline:#6b6578;--bg:#0e0f14;--surface:#16181f;--border:#2a2d38;--text:#e8eaf0;--muted:#6b7080;--accent:#f7c948}*{box-sizing:border-box;margin:0;padding:0}body{width:320px;height:480px;background:var(--bg);color:var(--text);font-family:Syne,sans-serif;overflow:hidden;display:flex;flex-direction:column}.header-container{display:flex;align-items:center;gap:10px;flex-shrink:0;border-bottom:1px solid var(--border)}header{padding:14px 18px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0}.header-options{all:unset;margin-left:auto;width:34px;height:34px;color:var(--muted);font-size:16px;line-height:1;cursor:pointer}.header-options:hover{color:var(--accent);border-color:var(--accent)}header .fish{font-size:22px;line-height:1}header h1{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}.tabs{display:flex;padding:0 18px;flex-shrink:0}.tab{flex:1;padding:10px 8px;background:0 0;border:none;border-bottom:2px solid transparent;color:var(--muted);font-family:Syne,sans-serif;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.tab.active{color:var(--accent);border-bottom-color:var(--accent)}.panels{flex:1;min-height:0;position:relative}.panel{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}.panel.hidden{display:none}.hero{padding:14px 18px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0}.posture-badge{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:3px 10px;border-radius:20px;transition:background .3s,color .3s}.posture-badge.sitting{background:#1b2a4a;color:var(--sit)}.posture-badge.standing{background:#0f2e28;color:var(--stand)}.posture-badge.walking{background:#2a1f45;color:var(--walk)}.timer{font-family:'Space Mono',monospace;font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1;transition:color .3s}.timer.sitting{color:var(--sit)}.timer.standing{color:var(--stand)}.timer.walking{color:var(--walk)}.timer-label{font-size:10px;color:var(--muted);letter-spacing:.05em}.toggle-row{padding:0 18px 12px;display:flex;gap:8px;flex-shrink:0}.toggle-row--walk{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.toggle-row--walk .btn{flex:unset;min-width:0;padding:9px 4px;font-size:11px}#btn-walk.hidden{display:none!important}.btn{flex:1;padding:9px 0;border:none;border-radius:8px;font-family:Syne,sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:opacity .2s,transform .1s;letter-spacing:.04em}.btn:active{transform:scale(.97)}.btn-sit{background:var(--sit);color:#fff}.btn-stand{background:var(--stand);color:#0a2a22}.btn-walk{background:var(--walk);color:#0e0f14}.btn.active{opacity:1}.btn:not(.active){opacity:.35}.overview{padding:10px 18px 12px;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}.overview-title{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;flex-shrink:0}.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;flex-shrink:0}.stats-grid--walk{grid-template-columns:repeat(3,1fr)}.stats-grid--walk .stat-box.offline{grid-column:1}.stats-grid--walk .stat-box.ratio{grid-column:2/4}.stat-box{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 8px}.stat-box .label{font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}.stat-box .value{font-family:'Space Mono',monospace;font-size:14px;font-weight:700}.stat-box.sit .value{color:var(--sit)}.stat-box.stand .value{color:var(--stand)}.stat-box.ratio .value{color:var(--accent)}.stat-box.offline .value{color:var(--offline)}.stat-box.walk .value{color:var(--walk)}.stat-box.walk.hidden{display:none}.timeline-label{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;flex-shrink:0}.timeline-track{height:16px;border-radius:4px;overflow:hidden;background:var(--border);display:flex;flex-shrink:0}.timeline-track .seg{height:100%;transition:width .4s ease}.timeline-track .seg.sitting{background:var(--sit)}.timeline-track .seg.standing{background:var(--stand)}.timeline-track .seg.walking{background:var(--walk)}.timeline-track .seg.offline{background:var(--offline)}.sessions-label{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px;flex-shrink:0}.sessions{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:3px}.session-row{display:flex;align-items:center;gap:6px;padding:4px 6px;background:var(--surface);border-radius:6px;font-family:'Space Mono',monospace;font-size:9px;flex-shrink:0}.session-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}.session-dot.sitting{background:var(--sit)}.session-dot.standing{background:var(--stand)}.session-dot.walking{background:var(--walk)}.session-row .time{color:var(--muted);flex:1;min-width:0}.session-row .dur{color:var(--text);font-weight:700}.week-panel{padding:12px 18px 14px;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}.week-panel .overview-title{margin-bottom:10px}.week{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;justify-content:space-between}.week-row{display:grid;grid-template-columns:48px 1fr;align-items:start;gap:6px;flex-shrink:0}.week-label{font-size:9px;font-weight:700;color:var(--muted);font-family:'Space Mono',monospace;line-height:1.2}.week-bar{height:11px;border-radius:3px;overflow:hidden;background:var(--border);display:flex}.week-bar .seg{height:100%;min-width:0}.week-bar .seg.sitting{background:var(--sit)}.week-bar .seg.standing{background:var(--stand)}.week-bar .seg.walking{background:var(--walk)}.week-bar .seg.offline{background:var(--offline)}.week-meta{font-size:8px;color:var(--muted);font-family:'Space Mono',monospace;margin-top:1px;line-height:1.2;word-break:break-all}</style></head><body><header><span class="fish">🐡</span><h1>Stand Up Or You'll Turn Into A Blob Fish</h1></header><div class="header-container"><div class="tabs" role="tablist"><button type="button" class="tab active" id="tab-day" role="tab" aria-selected="true">Day</button> <button type="button" class="tab" id="tab-week" role="tab" aria-selected="false">Week</button></div><button type="button" class="header-options" id="btn-open-options" title="Options">⚙</button></div><div class="panels"><div id="panel-day" class="panel" role="tabpanel" aria-hidden="false"><div class="hero"><span id="posture-badge" class="posture-badge sitting">Sitting</span><div id="timer" class="timer sitting">00:00</div><span class="timer-label">current session</span></div><div class="toggle-row" id="toggle-row"><button type="button" id="btn-sit" class="btn btn-sit active">🪑 Sitting</button> <button type="button" id="btn-stand" class="btn btn-stand">🧍 Standing</button> <button type="button" id="btn-walk" class="btn btn-walk hidden">🚶 Walk</button></div><div class="overview"><div class="stats-grid" id="stats-grid"><div class="stat-box sit"><div class="label">Sitting</div><div class="value" id="stat-sit">0h 0m</div></div><div class="stat-box stand"><div class="label">Standing</div><div class="value" id="stat-stand">0h 0m</div></div><div class="stat-box walk hidden" id="stat-walk-wrap"><div class="label">Walk</div><div class="value" id="stat-walk">0h 0m</div></div><div class="stat-box offline"><div class="label">Offline</div><div class="value" id="stat-offline">0h 0m</div></div><div class="stat-box ratio"><div class="label" id="stat-ratio-label">Stand %</div><div class="value" id="stat-ratio">0%</div></div></div><div class="sessions-label">Sessions</div><div class="sessions" id="sessions"></div></div></div><div id="panel-week" class="panel hidden" role="tabpanel" aria-hidden="true"><div class="week-panel"><div class="overview-title">Past week</div><div class="week" id="week-overview"></div></div></div></div><script src="popup.js"></script></body></html>
